<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<title>Morphna</title>
<style>
body{margin:0;font-family:Arial;background:#f5f5f5}
header{background:white;padding:15px;display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid #ddd}
.logo{font-weight:bold;color:#2e7d32;font-size:20px}
.search{width:300px;padding:8px}
.nav{display:flex;gap:10px;padding:10px;background:#fff;border-bottom:1px solid #ddd}
.nav button{border:none;background:#eee;padding:6px 10px;border-radius:5px;cursor:pointer}
.container{padding:20px;display:grid;grid-template-columns:repeat(4,1fr);gap:20px}
.card{background:white;border-radius:10px;overflow:hidden;cursor:pointer}
.img{height:150px;background-size:cover;background-position:center}
.info{padding:10px}
.price{font-weight:bold}
#writeBtn{position:fixed;bottom:20px;right:20px;background:#2e7d32;color:white;border:none;padding:15px;border-radius:50%;font-size:20px;cursor:pointer}
.modal{display:none;position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,0.5);z-index:10}
.modalContent{background:white;padding:20px;margin:50px auto;width:340px;border-radius:10px}
.modalContent input,.modalContent select,.modalContent textarea{width:95%;padding:8px}
textarea{height:90px;resize:none}
.detailImg{width:100%;height:260px;background-size:cover;background-position:center;border-radius:10px}
.detailPrice{font-size:20px;font-weight:bold;margin-top:10px}
.detailDesc{white-space:pre-wrap;background:#f7f7f7;padding:10px;border-radius:8px}
</style>
</head>

<body>

<header>
  <div class="logo">🦎 Morphna</div>
  <input class="search" id="search" placeholder="검색">
</header>

<div class="nav">
  <button onclick="filterItems('전체')">전체</button>
  <button onclick="filterItems('도마뱀')">도마뱀</button>
  <button onclick="filterItems('뱀')">뱀</button>
  <button onclick="filterItems('용품')">용품</button>
</div>

<div class="container" id="list"></div>

<button id="writeBtn" onclick="openWriteModal()">+</button>

<div class="modal" id="writeModal">
  <div class="modalContent">
    <h3>상품 등록</h3>
    <input id="title" placeholder="제목"><br><br>
    <input id="price" placeholder="가격"><br><br>
    <input type="file" id="file" accept="image/png,image/jpeg"><br><br>
    <select id="category">
      <option>도마뱀</option>
      <option>뱀</option>
      <option>용품</option>
    </select><br><br>
    <textarea id="description" placeholder="상품 설명을 입력하세요"></textarea><br><br>
    <button onclick="addItem()">등록</button>
    <button onclick="closeWriteModal()">닫기</button>
  </div>
</div>

<div class="modal" id="detailModal">
  <div class="modalContent">
    <div id="detailImage" class="detailImg"></div>
    <h3 id="detailTitle"></h3>
    <div id="detailPrice" class="detailPrice"></div>
    <p id="detailCategory"></p>
    <div id="detailDescription" class="detailDesc"></div><br>
    <button onclick="closeDetailModal()">닫기</button>
  </div>
</div>

<script>
const API = "https://morphna-server.onrender.com";
let items = [];

async function loadItems(){
  const res = await fetch(API + "/items");
  items = await res.json();
  render(items);
}

function render(data){
  list.innerHTML = "";

  data.forEach(i=>{
    const card = document.createElement("div");
    card.className = "card";

    card.innerHTML = `
      <div class="img" style="background-image:url('${i.img || "https://via.placeholder.com/300"}')"></div>
      <div class="info">
        <div>${i.title}</div>
        <div class="price">${i.price}원</div>
        <small>${i.category}</small>
      </div>
    `;

    card.onclick = () => openDetailModal(i);
    list.appendChild(card);
  });
}

function openWriteModal(){
  writeModal.style.display = "block";
}

function closeWriteModal(){
  writeModal.style.display = "none";
}

function openDetailModal(item){
  detailImage.style.backgroundImage = `url('${item.img || "https://via.placeholder.com/300"}')`;
  detailTitle.innerText = item.title;
  detailPrice.innerText = item.price + "원";
  detailCategory.innerText = "카테고리: " + item.category;
  detailDescription.innerText = item.description || "등록된 설명이 없습니다.";
  detailModal.style.display = "block";
}

function closeDetailModal(){
  detailModal.style.display = "none";
}

async function addItem(){
  const selectedFile = file.files[0];

  if(!title.value || !price.value){
    alert("제목과 가격을 입력해줘");
    return;
  }

  if(selectedFile){
    const reader = new FileReader();

    reader.onload = async function(e){
      await uploadItem(e.target.result);
    };

    reader.readAsDataURL(selectedFile);
  } else {
    await uploadItem("");
  }
}

async function uploadItem(imageData){
  await fetch(API + "/items", {
    method: "POST",
    headers: {"Content-Type":"application/json"},
    body: JSON.stringify({
      title: title.value,
      price: price.value,
      img: imageData,
      category: category.value,
      description: description.value
    })
  });

  title.value = "";
  price.value = "";
  file.value = "";
  description.value = "";
  writeModal.style.display = "none";

  loadItems();
}

function filterItems(cat){
  if(cat === "전체") render(items);
  else render(items.filter(i => i.category === cat));
}

search.oninput = () => {
  const keyword = search.value.toLowerCase();
  render(items.filter(i => i.title.toLowerCase().includes(keyword)));
};

loadItems();
</script>

</body>
</html>
