<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<title>Morphna</title>
<style>
body{margin:0;font-family:Arial;background:#f5f5f5}
header{background:white;padding:15px;display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid #ddd}
.logo{font-weight:bold;color:#2e7d32;font-size:22px}
.search{width:300px;padding:10px;border:1px solid #ddd;border-radius:6px}
.nav{display:flex;gap:10px;padding:10px;background:#fff;border-bottom:1px solid #ddd}
.nav button{border:none;background:#eee;padding:7px 12px;border-radius:20px;cursor:pointer}
.container{padding:20px;display:grid;grid-template-columns:repeat(4,1fr);gap:20px}
.card{background:white;border-radius:10px;overflow:hidden;cursor:pointer;border:1px solid #eee}
.cardImg{width:100%;aspect-ratio:1/1;background-size:cover;background-position:center;background-color:#ddd}
.info{padding:10px}
.price{font-weight:bold;margin-top:5px}
#writeBtn{position:fixed;bottom:20px;right:20px;background:#2e7d32;color:white;border:none;width:60px;height:60px;border-radius:50%;font-size:30px;cursor:pointer;z-index:20}
.modal{display:none;position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,0.5);z-index:50}
.modalContent{background:white;padding:20px;margin:50px auto;width:340px;border-radius:10px}
.modalContent input,.modalContent select,.modalContent textarea{width:95%;padding:8px}
textarea{height:90px;resize:none}
.detailPage{display:none;position:fixed;top:0;left:0;width:100%;height:100%;background:#f5f5f5;z-index:100;overflow:auto}
.detailHeader{background:white;padding:15px;border-bottom:1px solid #ddd;position:sticky;top:0}
.detailHeader button{font-size:18px;background:none;border:none;cursor:pointer}
.detailWrap{max-width:900px;margin:0 auto;background:white;min-height:100vh}
.detailImg{width:100%;aspect-ratio:1/1;background-size:cover;background-position:center;background-color:#ddd}
.detailInfo{padding:20px}
.detailTitle{font-size:24px;font-weight:bold}
.detailPrice{font-size:26px;font-weight:bold;margin:12px 0}
.detailDesc{white-space:pre-wrap;background:#f7f7f7;padding:12px;border-radius:8px;line-height:1.5}
.chatBtn{width:100%;padding:14px;background:#2e7d32;color:white;border:none;border-radius:8px;margin-top:15px;font-size:16px}
.similar{padding:20px;border-top:10px solid #f5f5f5}
.similarGrid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
.chatBox{display:none;position:fixed;right:20px;bottom:80px;width:320px;height:400px;background:white;border:1px solid #ddd;border-radius:10px;z-index:200;overflow:hidden}
.chatHeader{background:#2e7d32;color:white;padding:10px}
.chatMessages{height:280px;overflow:auto;padding:10px;background:#f7f7f7}
.chatInput{display:flex;border-top:1px solid #ddd}
.chatInput input{flex:1;padding:10px;border:none}
.chatInput button{width:70px;background:#2e7d32;color:white;border:none}
</style>
</head>

<body>

<header>
  <div class="logo">🦎 Morphna</div>
  <input class="search" id="search" placeholder="검색">
</header>

<div class="nav">
  <button onclick="filterItems('전체')">전체</button>
  <button onclick="filterItems('도마뱀')">도마뱀</button>
  <button onclick="filterItems('뱀')">뱀</button>
  <button onclick="filterItems('용품')">용품</button>
</div>

<div class="container" id="list"></div>

<button id="writeBtn" onclick="openWriteModal()">+</button>

<div class="modal" id="writeModal">
  <div class="modalContent">
    <h3>상품 등록</h3>
    <input id="title" placeholder="제목"><br><br>
    <input id="price" placeholder="가격"><br><br>
    <input type="file" id="file" accept="image/png,image/jpeg"><br><br>
    <select id="category">
      <option>도마뱀</option>
      <option>뱀</option>
      <option>용품</option>
    </select><br><br>
    <textarea id="description" placeholder="상품 설명"></textarea><br><br>
    <button onclick="addItem()">등록</button>
    <button onclick="closeWriteModal()">닫기</button>
  </div>
</div>

<div class="detailPage" id="detailPage">
  <div class="detailHeader">
    <button onclick="closeDetail()">← 뒤로가기</button>
  </div>

  <div class="detailWrap">
    <div id="detailImage" class="detailImg"></div>

    <div class="detailInfo">
      <div id="detailTitle" class="detailTitle"></div>
      <div id="detailPrice" class="detailPrice"></div>
      <p id="detailCategory"></p>
      <div id="detailDesc" class="detailDesc"></div>
      <button class="chatBtn" onclick="openChat()">채팅하기</button>
    </div>

    <div class="similar">
      <h3>비슷한 상품</h3>
      <div class="similarGrid" id="similarList"></div>
    </div>
  </div>
</div>

<div class="chatBox" id="chatBox">
  <div class="chatHeader">
    채팅
    <button onclick="closeChat()" style="float:right;background:none;border:none;color:white">X</button>
  </div>
  <div class="chatMessages" id="chatMessages"></div>
  <div class="chatInput">
    <input id="chatText" placeholder="메시지 입력">
    <button onclick="sendChat()">전송</button>
  </div>
</div>

<script>
const API = "https://morphna-server.onrender.com";
let items = [];
const defaultImg = "https://via.placeholder.com/600";

async function loadItems(){
  try{
    const res = await fetch(API + "/items");
    items = await res.json();
    render(items);
  }catch(error){
    alert("서버 연결 실패");
    console.log(error);
  }
}

function render(data){
  list.innerHTML = "";

  data.forEach(item=>{
    const card = document.createElement("div");
    card.className = "card";

    card.innerHTML = `
      <div class="cardImg" style="background-image:url('${item.img || defaultImg}')"></div>
      <div class="info">
        <div>${item.title}</div>
        <div class="price">${Number(item.price).toLocaleString()}원</div>
        <small>${item.category}</small>
      </div>
    `;

    card.onclick = () => openDetail(item);
    list.appendChild(card);
  });
}

function openWriteModal(){
  writeModal.style.display = "block";
}

function closeWriteModal(){
  writeModal.style.display = "none";
}

async function addItem(){
  if(!title.value || !price.value){
    alert("제목과 가격을 입력해줘");
    return;
  }

  const selectedFile = file.files[0];

  if(selectedFile){
    const reader = new FileReader();
    reader.onload = async function(e){
      await uploadItem(e.target.result);
    };
    reader.readAsDataURL(selectedFile);
  } else {
    await uploadItem("");
  }
}

async function uploadItem(imageData){
  await fetch(API + "/items", {
    method:"POST",
    headers:{"Content-Type":"application/json"},
    body:JSON.stringify({
      title:title.value,
      price:price.value,
      img:imageData,
      category:category.value,
      description:description.value
    })
  });

  title.value = "";
  price.value = "";
  file.value = "";
  description.value = "";
  writeModal.style.display = "none";

  loadItems();
}

function openDetail(item){
  detailImage.style.backgroundImage = `url('${item.img || defaultImg}')`;
  detailTitle.innerText = item.title;
  detailPrice.innerText = Number(item.price).toLocaleString() + "원";
  detailCategory.innerText = "카테고리: " + item.category;
  detailDesc.innerText = item.description || "등록된 설명이 없습니다.";

  renderSimilar(item);
  detailPage.style.display = "block";
}

function closeDetail(){
  detailPage.style.display = "none";
}

function renderSimilar(currentItem){
  similarList.innerHTML = "";

  const similar = items
    .filter(item => item._id !== currentItem._id && item.category === currentItem.category)
    .slice(0, 6);

  if(similar.length === 0){
    similarList.innerHTML = "<p>비슷한 상품이 없습니다.</p>";
    return;
  }

  similar.forEach(item=>{
    const card = document.createElement("div");
    card.className = "card";

    card.innerHTML = `
      <div class="cardImg" style="background-image:url('${item.img || defaultImg}')"></div>
      <div class="info">
        <div>${item.title}</div>
        <div class="price">${Number(item.price).toLocaleString()}원</div>
      </div>
    `;

    card.onclick = () => openDetail(item);
    similarList.appendChild(card);
  });
}

function openChat(){
  chatBox.style.display = "block";
}

function closeChat(){
  chatBox.style.display = "none";
}

function sendChat(){
  if(!chatText.value) return;

  const msg = document.createElement("div");
  msg.style.background = "#2e7d32";
  msg.style.color = "white";
  msg.style.padding = "8px";
  msg.style.margin = "8px 0";
  msg.style.borderRadius = "8px";
  msg.style.textAlign = "right";
  msg.innerText = chatText.value;

  chatMessages.appendChild(msg);
  chatText.value = "";
}

function filterItems(cat){
  if(cat === "전체") render(items);
  else render(items.filter(item => item.category === cat));
}

search.oninput = () => {
  const keyword = search.value.toLowerCase();
  render(items.filter(item => item.title.toLowerCase().includes(keyword)));
};

loadItems();
</script>

</body>
</html>
