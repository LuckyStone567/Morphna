<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<title>Morphna</title>

<style>
body{margin:0;font-family:Arial;background:#f5f5f5}

header{background:white;padding:15px;display:flex;justify-content:space-between;border-bottom:1px solid #ddd}
.logo{font-weight:bold;color:#2e7d32;font-size:22px}
.search{width:300px;padding:8px}

.nav{display:flex;gap:10px;padding:10px;background:#fff;border-bottom:1px solid #ddd}
.nav button{border:none;background:#eee;padding:6px 10px;border-radius:20px;cursor:pointer}

.container{padding:20px;display:grid;grid-template-columns:repeat(4,1fr);gap:20px}

.card{background:white;border-radius:10px;overflow:hidden;cursor:pointer}
.cardImg{width:100%;aspect-ratio:1/1;background-size:cover;background-position:center}
.info{padding:10px}
.price{font-weight:bold}

#writeBtn{position:fixed;bottom:20px;right:20px;background:#2e7d32;color:white;border:none;width:60px;height:60px;border-radius:50%;font-size:28px;cursor:pointer}

.modal{display:none;position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,0.5)}
.modalContent{background:white;padding:20px;margin:50px auto;width:320px;border-radius:10px}
.modalContent input,.modalContent select,.modalContent textarea{width:95%;padding:8px}

.detailPage{display:none;position:fixed;top:0;left:0;width:100%;height:100%;background:#f5f5f5;z-index:100;overflow:auto}
.detailWrap{max-width:900px;margin:auto;background:white}
.detailImg{width:100%;aspect-ratio:1/1;background-size:cover;background-position:center}
.detailInfo{padding:20px}
.detailTitle{font-size:22px;font-weight:bold}
.detailPrice{font-size:24px;font-weight:bold;margin:10px 0}
.detailDesc{white-space:pre-wrap;background:#f7f7f7;padding:10px;border-radius:8px}

.similar{padding:20px;border-top:10px solid #f5f5f5}
.similarGrid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}

.chatBtn{width:100%;padding:12px;background:#2e7d32;color:white;border:none;border-radius:8px;margin-top:10px}

.chatBox{display:none;position:fixed;right:20px;bottom:80px;width:300px;height:400px;background:white;border-radius:10px;border:1px solid #ddd}
.chatHeader{background:#2e7d32;color:white;padding:10px}
.chatMessages{height:260px;overflow:auto;padding:10px}
.chatInput{display:flex}
.chatInput input{flex:1;padding:10px;border:none}
.chatInput button{width:70px;background:#2e7d32;color:white;border:none}
</style>
</head>

<body>

<header>
<div class="logo">🦎 Morphna</div>
<input class="search" id="search" placeholder="검색">
</header>

<div class="nav">
<button onclick="filterItems('전체')">전체</button>
<button onclick="filterItems('도마뱀')">도마뱀</button>
<button onclick="filterItems('뱀')">뱀</button>
<button onclick="filterItems('용품')">용품</button>
</div>

<div class="container" id="list"></div>

<button id="writeBtn" onclick="openWriteModal()">+</button>

<div class="modal" id="writeModal">
<div class="modalContent">
<h3>상품 등록</h3>
<input id="title" placeholder="제목"><br><br>
<input id="price" placeholder="가격"><br><br>
<input type="file" id="file"><br><br>
<select id="category">
<option>도마뱀</option>
<option>뱀</option>
<option>용품</option>
</select><br><br>
<textarea id="description" placeholder="설명"></textarea><br><br>
<button onclick="addItem()">등록</button>
<button onclick="closeWriteModal()">닫기</button>
</div>
</div>

<div class="detailPage" id="detailPage">
<div class="detailWrap">
<div id="detailImage" class="detailImg"></div>

<div class="detailInfo">
<div id="detailTitle" class="detailTitle"></div>
<div id="detailPrice" class="detailPrice"></div>
<div id="detailDesc" class="detailDesc"></div>

<button class="chatBtn" onclick="openChat()">채팅하기</button>
</div>

<div class="similar">
<h3>비슷한 상품</h3>
<div class="similarGrid" id="similarList"></div>
</div>

</div>
</div>

<div class="chatBox" id="chatBox">
<div class="chatHeader">채팅 <button onclick="closeChat()" style="float:right;background:none;border:none;color:white">X</button></div>
<div class="chatMessages" id="chatMessages"></div>
<div class="chatInput">
<input id="chatText">
<button onclick="sendChat()">전송</button>
</div>
</div>

<script>
const API="https://morphna-server.onrender.com";
let items=[];

async function loadItems(){
const res=await fetch(API+"/items");
items=await res.json();
render(items);
}

function render(data){
list.innerHTML="";
data.forEach(i=>{
const card=document.createElement("div");
card.className="card";

card.innerHTML=`
<div class="cardImg" style="background-image:url('${i.img}')"></div>
<div class="info">
<div>${i.title}</div>
<div class="price">${i.price}원</div>
</div>
`;

card.onclick=()=>openDetail(i);
list.appendChild(card);
});
}

function openDetail(i){
detailImage.style.backgroundImage=`url('${i.img}')`;
detailTitle.innerText=i.title;
detailPrice.innerText=i.price+"원";
detailDesc.innerText=i.description||"설명 없음";

renderSimilar(i);
detailPage.style.display="block";
}

function renderSimilar(current){
similarList.innerHTML="";
const similar=items.filter(i=>i.category===current.category && i._id!==current._id).slice(0,6);

similar.forEach(i=>{
const el=document.createElement("div");
el.className="card";

el.innerHTML=`
<div class="cardImg" style="background-image:url('${i.img}')"></div>
<div class="info">${i.title}</div>
`;

el.onclick=()=>openDetail(i);
similarList.appendChild(el);
});
}

function openWriteModal(){writeModal.style.display="block";}
function closeWriteModal(){writeModal.style.display="none";}

async function addItem(){
const fileData=file.files[0];
const reader=new FileReader();

reader.onload=async e=>{
await fetch(API+"/items",{
method:"POST",
headers:{"Content-Type":"application/json"},
body:JSON.stringify({
title:title.value,
price:price.value,
img:e.target.result,
category:category.value,
description:description.value
})
});
loadItems();
writeModal.style.display="none";
};

reader.readAsDataURL(fileData);
}

/* 채팅 */
function openChat(){chatBox.style.display="block";}
function closeChat(){chatBox.style.display="none";}
function sendChat(){
if(!chatText.value) return;
const msg=document.createElement("div");
msg.innerText=chatText.value;
chatMessages.appendChild(msg);
chatText.value="";
}

function filterItems(cat){
if(cat==="전체") render(items);
else render(items.filter(i=>i.category===cat));
}

search.oninput=()=>{
const keyword=search.value.toLowerCase();
render(items.filter(i=>i.title.toLowerCase().includes(keyword)));
};

loadItems();
</script>

</body>
</html>
